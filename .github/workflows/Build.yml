name: Build DarkTV Android APK

on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-1.0.0}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${#VERSION}" -gt 40 ]; then
            echo '::error::Version must be X.Y.Z (numbers only).'
            exit 1
          fi
          echo "DARKTV_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "DARKTV_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Gradle distribution service can return transient 5xx responses.
      - name: Setup Gradle (attempt 1)
        id: gradle_first
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup Gradle (attempt 2)
        id: gradle_second
        if: steps.gradle_first.outcome == 'failure'
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup Gradle (attempt 3)
        if: steps.gradle_second.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build and test debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A disposable key tests signing on branches; this APK is never distributed.
      - name: Verify release signing with a disposable CI key
        if: github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
        env:
          DARKTV_KEYSTORE_PATH: ${{ runner.temp }}/test-signing.p12
          DARKTV_STORE_PASSWORD: ci-test-password
          DARKTV_KEY_ALIAS: ci-test
          DARKTV_KEY_PASSWORD: ci-test-password
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$DARKTV_KEYSTORE_PATH" \
            -storepass "$DARKTV_STORE_PASSWORD" -keypass "$DARKTV_KEY_PASSWORD" \
            -alias "$DARKTV_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI test only'
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-build.log
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/*.apk

      - name: Prepare release signing key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using stable repository release keystore."
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.p12"
            echo "DARKTV_KEYSTORE_PATH=$RUNNER_TEMP/release-signing.p12" >> "$GITHUB_ENV"
            echo "DARKTV_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DARKTV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DARKTV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Release secrets not found (e.g. in fork); generating fallback CI release key."
            KEY_PATH="$RUNNER_TEMP/fallback-release.p12"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEY_PATH" \
              -storepass "ci-fallback-password" -keypass "ci-fallback-password" \
              -alias "ci-fallback" -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=CI Fallback Release'
            echo "DARKTV_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "DARKTV_STORE_PASSWORD=ci-fallback-password" >> "$GITHUB_ENV"
            echo "DARKTV_KEY_ALIAS=ci-fallback" >> "$GITHUB_ENV"
            echo "DARKTV_KEY_PASSWORD=ci-fallback-password" >> "$GITHUB_ENV"
          fi

      - name: Build and verify signed release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-build.log
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/*.apk
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/DarkTV-${DARKTV_VERSION_NAME}.apk"

      - name: Report build errors
        if: failure()
        run: |
          if [ -f /tmp/gradle-build.log ]; then
            grep -E '(^e: |What went wrong|Execution failed|Could not |error:|FAILED)' /tmp/gradle-build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done || true
          fi

      - name: Upload signed release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish signed release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never update an existing release or reuse any existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$DARKTV_VERSION_NAME" >/dev/null; then
            echo "Tag $DARKTV_VERSION_NAME already exists; leaving it unchanged."
          else
            gh release create "$DARKTV_VERSION_NAME" "app/build/outputs/apk/release/DarkTV-${DARKTV_VERSION_NAME}.apk" \
              --target "$GITHUB_SHA" --title "Dark TV $DARKTV_VERSION_NAME" --latest \
              --notes 'Signed with the repository release keystore. Versions signed with a different key cannot be upgraded in place.'
          fi
